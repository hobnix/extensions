# Prepares the next release (hobnix/server#615): raises the versions from the `bump:` labels of the merged pull requests and opens a
# pull request into develop. Run it by hand on `develop`. The steps are the shared workflow of hobnix/server (package-prepare-release.yml).
# The second job (hobnix/extensions#30, hobnix/core#1129) adds the Rust programs to that pull request: it builds every crate twice with the
# toolchain of rust-toolchain.toml, aborts on a hash difference, writes the sha256 into package.toml, runs scripts/binary-check.py, commits
# programs and hashes in ONE commit apart from the version bump, pushes the branch and appends the table (path, size, sha256, source commit)
# to the pull request body. With no crate under extensions/ it does nothing. Nobody reviews a binary: those checks are the safeguard.
# Not run yet. A push with the workflow token starts no `check` run: push an empty commit or reopen the pull request by hand (owner).
name: prepare-release
on:
  workflow_dispatch:
jobs:
  prepare:
    uses: hobnix/server/.github/workflows/package-prepare-release.yml@develop
    permissions:
      contents: write
      pull-requests: write
  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The release pull request the preparation just opened
        id: pr
        run: |
          # the newest open pull request into develop from release/prepare-*; none = nothing was changed, nothing to do
          br=$(gh pr list --base develop --state open --json headRefName,createdAt \
                 --jq '[.[] | select(.headRefName | startswith("release/prepare-"))] | sort_by(.createdAt) | last | .headRefName // ""')
          echo "branch=$br" >> "$GITHUB_OUTPUT"
          echo "release branch: ${br:-none}"
      - name: Any Rust extension?
        id: crates
        if: steps.pr.outputs.branch != ''
        run: |
          n=$(ls extensions/*/Cargo.toml 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Check out the release branch
        if: steps.crates.outputs.count != '' && steps.crates.outputs.count != '0'
        run: git checkout -q -B "${{ steps.pr.outputs.branch }}" "origin/${{ steps.pr.outputs.branch }}"
      - name: Toolchain (pinned in rust-toolchain.toml) and musl
        if: steps.crates.outputs.count != '' && steps.crates.outputs.count != '0'
        run: |
          python3 -I scripts/binary-check.py toolchain --online
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup show active-toolchain || rustup toolchain install
      - name: Build twice, install, check, commit, push, describe in the pull request
        if: steps.crates.outputs.count != '' && steps.crates.outputs.count != '0'
        run: |
          git config user.name "hobnix release"; git config user.email "release@users.noreply.github.com"
          bash scripts/prepare-binaries.sh --push
